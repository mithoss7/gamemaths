definitions:
  - terme: "Notion"
    texte: "Unité d'apprentissage : identifiant, titre, contenu de cours, liste de gabarits d'exercices, liste d'identifiants de notions-prérequis."
  - terme: "Exercice"
    texte: "Question fermée rattachée à une notion. Possède un énoncé, un type de réponse, une réponse attendue et une explication. Produit comme instance d'un gabarit ; la réponse soumise est jugée par la règle d'acceptation de ce gabarit."
  - terme: "Prérequis"
    texte: "Notion qui doit être Maîtrisée avant qu'une autre notion devienne accessible."
  - terme: "Statut durable"
    texte: "Information persistée sur l'appareil, parmi : Non abordée, Abordée, Maîtrisée."
  - terme: "État affiché"
    texte: "État calculé à la volée pour l'affichage, parmi : Verrouillée, Disponible, En cours, Maîtrisée. Il se déduit du statut durable et du statut des prérequis."
  - terme: "Progression"
    texte: "Ensemble des statuts durables des notions pour un apprenant. Donnée locale et persistée."
  - terme: "Session"
    texte: "Période d'activité continue sur une notion. Elle commence à l'entrée dans les exercices de la notion et se termine dès que l'apprenant quitte la notion (retour à la carte, autre notion, rechargement ou fermeture). La navigation interne entre cours et exercices ne l'interrompt pas. Pas de fin par inactivité au MVP."
  - terme: "Série"
    texte: "Nombre de réussites consécutives, sur des exercices distincts, au sein d'une même session. Donnée volatile : elle naît à 0 et est perdue à la fin de la session."
  - terme: "N"
    texte: "Nombre de réussites requises pour maîtriser une notion. Paramètre configurable, valeur par défaut 3."
  - terme: "Gabarit"
    texte: "Modèle paramétré d'exercice rattaché à une notion. Il définit un type d'exercice, un type de réponse, des paramètres, des contraintes de tirage, une règle de calcul de la réponse attendue, une règle d'acceptation et une explication. Le système l'instancie en tirant des valeurs concrètes."
  - terme: "Instance"
    texte: "Exercice concret obtenu en instanciant un gabarit (valeurs tirées). Deux instances dont les valeurs diffèrent sont des exercices différents ; deux instances d'un même gabarit tirées avec les mêmes valeurs sont le même exercice."
  - terme: "Type de réponse"
    texte: "Forme que doit prendre la réponse à un exercice, parmi : entier, fraction, comparateur (<, > ou =), couple de fractions, choix parmi des propositions."
  - terme: "Réponse bien formée"
    texte: "Saisie conforme au type de réponse de l'exercice, les espaces étant ignorés. Entier : un entier naturel. Fraction : un entier naturel, ou une écriture a/b où a et b sont des entiers naturels et b est non nul ; une écriture décimale n'est pas une fraction bien formée. Comparateur : l'un des symboles <, > ou =. Couple de fractions : deux fractions bien formées. Choix : l'une des propositions affichées."
  - terme: "Forme irréductible"
    texte: "Écriture d'une valeur dont le numérateur et le dénominateur n'ont pas d'autre diviseur commun que 1. Une valeur entière a pour forme irréductible l'entier lui-même (et non une fraction de dénominateur 1)."
  - terme: "Réponse attendue"
    texte: "Réponse correcte de référence d'un exercice, calculée de façon déterministe à partir des valeurs tirées ; c'est elle que montre la correction. Quand plusieurs réponses sont correctes, elle est l'une d'elles."
  - terme: "Règle d'acceptation"
    texte: "Règle portée par le gabarit, qui décide si une réponse bien formée est correcte, parmi : identité (la réponse est exactement la réponse attendue), valeur (la réponse a la même valeur que la réponse attendue, quelle que soit son écriture), irréductible (la réponse est la réponse attendue écrite sous forme irréductible), condition (la réponse vérifie une propriété définie par le gabarit ; plusieurs réponses peuvent alors être correctes)."
