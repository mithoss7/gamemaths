  <g><rect class="box" x="80" y="112" width="220" height="54" rx="8" fill="#e6f3f1"/><text class="t" x="190" y="134" text-anchor="middle">N2 · Fractions équivalentes</text><text class="s" x="190" y="152" text-anchor="middle">multiplier num. et dénom.</text></g>
  <g><rect class="box" x="380" y="112" width="220" height="54" rx="8" fill="#e6f3f1"/><text class="t" x="490" y="134" text-anchor="middle">N3 · Représentation / droite</text><text class="s" x="490" y="152" text-anchor="middle">placer une fraction</text></g>
