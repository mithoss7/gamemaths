id: EX-PARCOURS-01
titre: "Accès aux notions depuis la carte"
statut: valide
section: "9"
rationale: >
  La carte du parcours autorise l'entrée dans les notions Disponible, En cours
  et Maîtrisée (ces dernières restant consultables pour révision : l'apprenant
  peut revoir le cours et refaire des exercices, sans effet sur le statut
  durable, qui reste Maîtrisée), et refuse
  l'entrée dans les notions Verrouillées en indiquant le prérequis manquant.
