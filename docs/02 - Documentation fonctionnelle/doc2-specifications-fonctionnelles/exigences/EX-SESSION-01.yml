id: EX-SESSION-01
titre: "Fin de session et remise à zéro de la série"
statut: en_revue
section: "8"
rationale: >
  « N réussites d'affilée » s'entend au sein d'une même session, sans quitter la
  notion. Quitter la notion termine la session et remet la série à zéro ; la
  navigation interne (cours, exercices) ne l'interrompt pas.
