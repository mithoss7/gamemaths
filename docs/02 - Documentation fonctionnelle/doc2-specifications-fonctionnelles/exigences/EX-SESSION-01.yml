id: EX-SESSION-01
titre: "Fin de session et remise à zéro de la série"
statut: en_revue
section: "8"
rationale: >
  Les N réussites requises s'entendent au sein d'une même session, sans quitter
  la notion. Quitter la notion termine la session et remet la série à zéro, quel
  que soit le nombre de réussites déjà accumulées ; la navigation interne entre
  le cours et les exercices ne l'interrompt pas.
