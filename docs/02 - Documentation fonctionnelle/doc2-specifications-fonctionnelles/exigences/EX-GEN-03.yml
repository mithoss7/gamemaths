id: EX-GEN-03
titre: "Forme de la réponse attendue"
statut: en_revue
section: "11"
rationale: >
  La réponse attendue est celle que montre la correction après une erreur
  (EX-PARCOURS-02). Elle est donc donnée sous sa forme la plus simple : forme
  irréductible pour une fraction, plus petit dénominateur commun pour une mise
  au même dénominateur. Cela ne restreint pas les réponses acceptées, qui
  relèvent de la règle d'acceptation du gabarit (section 12).
