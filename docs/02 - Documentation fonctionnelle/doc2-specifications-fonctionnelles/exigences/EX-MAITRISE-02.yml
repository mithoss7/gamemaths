id: EX-MAITRISE-02
titre: "Progression et rupture de la série"
statut: en_revue
section: "7"
rationale: >
  La maîtrise s'obtient par une série de N réussites. Une réussite incrémente la
  série ; une erreur la remet à zéro. Atteindre N fait passer la notion à
  Maîtrisée.
