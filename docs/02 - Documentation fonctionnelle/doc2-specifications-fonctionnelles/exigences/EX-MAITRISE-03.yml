id: EX-MAITRISE-03
titre: "Garantie d'exercices distincts au sein d'une série"
statut: valide
section: "7"
rationale: >
  Le système garantit qu'au sein d'une même série, deux réussites ne portent
  jamais sur le même exercice : un exercice déjà réussi dans la série en cours
  n'est pas reproposé tant que la série n'est pas rompue. L'apprenant ne peut
  donc jamais atteindre la maîtrise en répétant un même item ; la maîtrise
  atteste d'une compétence sur des exercices distincts.
