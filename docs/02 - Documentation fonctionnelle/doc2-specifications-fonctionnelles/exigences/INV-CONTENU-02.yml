id: INV-CONTENU-02
titre: "Capacité de génération d'au moins N exercices distincts par notion"
statut: valide
section: "10"
rationale: >
  Avec la génération paramétrique, une notion doit pouvoir produire au moins N
  instances distinctes, sinon la maîtrise (N réussites sur des exercices
  distincts) serait inatteignable. Cette contrainte borne de fait la valeur
  configurable de N : N ne peut excéder la capacité générative de la notion la
  moins fournie.
trace:
  verifie_par: INV-CONTENU-02.feature
  satisfait: [OBJ-03, OBJ-04]