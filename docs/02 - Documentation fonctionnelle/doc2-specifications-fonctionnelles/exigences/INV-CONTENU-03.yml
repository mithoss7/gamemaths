id: INV-CONTENU-03
titre: "Explication obligatoire portée par le gabarit"
statut: valide
section: "10"
rationale: >
  L'affichage d'une explication après une erreur est une règle de parcours
  (EX-PARCOURS-02). L'explication est portée par le gabarit, et non par chaque
  instance : chaque gabarit doit donc fournir une explication non vide, dont
  héritent toutes les instances qu'il produit.
