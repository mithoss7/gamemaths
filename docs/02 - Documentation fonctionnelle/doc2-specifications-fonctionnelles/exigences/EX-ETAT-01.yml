id: EX-ETAT-01
titre: "Verrouillage d'une notion selon ses prérequis"
statut: valide
section: "5"
rationale: >
  L'accès à une notion dépend de l'état de ses prérequis. Une notion sans
  prérequis est immédiatement accessible ; un seul prérequis non maîtrisé
  suffit à la verrouiller. Le statut durable Maîtrisée prime toutefois sur
  le verrouillage : une notion maîtrisée reste affichée Maîtrisée, même si
  l'évolution du contenu lui ajoute un prérequis non maîtrisé.
trace:
